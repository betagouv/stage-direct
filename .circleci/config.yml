version: 2.1

orbs:
  node: circleci/node@7.1.0

executors:
  default:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
  with-postgres:
    docker:
      - image: cimg/node:22.14
      - image: cimg/postgres:17.0
        environment:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stage_direct_test
    working_directory: ~/project
  playwright:
    docker:
      - image: mcr.microsoft.com/playwright:v1.59.1-jammy
      - image: cimg/postgres:17.0
        environment:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stage_direct_test
    working_directory: ~/project

commands:
  install-pnpm:
    steps:
      - run:
          name: Install pnpm
          command: corepack enable && corepack prepare pnpm@9.15.4 --activate
  setup:
    steps:
      - checkout
      - install-pnpm
      - restore_cache:
          keys:
            - pnpm-store-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Generate Prisma client
          command: pnpm db:generate
  wait-for-postgres:
    steps:
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              nc -z localhost 5432 && echo "postgres up" && exit 0
              sleep 1
            done
            echo "postgres did not start" && exit 1

jobs:
  lint:
    executor: default
    steps:
      - setup
      - run:
          name: Lint
          command: pnpm lint

  typecheck:
    executor: default
    steps:
      - setup
      - run:
          name: Typecheck
          command: pnpm typecheck

  build:
    executor: default
    steps:
      - setup
      - run:
          name: Build all packages
          command: pnpm build

  test-integration:
    executor: with-postgres
    environment:
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/stage_direct_test
    steps:
      - setup
      - wait-for-postgres
      - run:
          name: Run integration tests
          command: pnpm test:integration

  test-e2e:
    executor: playwright
    environment:
      DATABASE_URL: postgresql://test:test@localhost:5432/stage_direct_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-prod
      CI: "true"
    steps:
      - setup
      - wait-for-postgres
      - run:
          name: Apply schema to test DB
          command: pnpm --filter web db:push --accept-data-loss
      - run:
          name: Run Playwright tests
          command: pnpm test:e2e

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - build
      - test-integration
      - test-e2e:
          requires:
            - build
